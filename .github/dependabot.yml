# Written by machine-config/repo-tools/dependabot.py. Patch and minor bumps are
# grouped into one weekly PR per ecosystem and merged automatically once checks pass;
# major bumps arrive as separate PRs for a human to review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/functions"
      - "/functions/src/dataconnect-admin-generated"
      - "/functions/src/dataconnect-admin-generated/esm"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
